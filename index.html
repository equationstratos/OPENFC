<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualiseur OpenFC 3D</title>
    <!-- Tailwind CSS pour un design moderne et rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
        #webgl-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; width: 90%; max-width: 600px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; padding: 1.25rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>

    <!-- Conteneur 3D Three.js -->
    <div id="webgl-container"></div>

    <!-- Interface utilisateur (UI) -->
    <div id="ui-overlay">
        <!-- Barre de progression -->
        <div class="flex justify-between items-center mb-2 text-xs font-semibold text-slate-400">
            <span id="cTitle" class="text-indigo-400 uppercase tracking-wider">Chargement...</span>
            <span id="pCount">1/8</span>
        </div>
        <div class="w-full bg-slate-800 h-1.5 rounded-full mb-4 overflow-hidden">
            <div id="barFill" class="bg-indigo-500 h-full transition-all duration-300 rounded-full" style="width: 0%;"></div>
        </div>

        <!-- Informations de l'étape -->
        <div class="mb-4">
            <h2 id="cWhat" class="text-lg font-bold text-slate-100">Initialisation de la scène</h2>
            <p id="cBlurb" class="text-sm text-slate-400 mt-1">Veuillez patienter pendant le chargement des modèles 3D...</p>
        </div>

        <!-- Boutons de navigation -->
        <div class="flex justify-between items-center pt-2 border-t border-slate-800">
            <button id="btnBack" disabled class="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-sm font-medium rounded-lg transition">← Précédent</button>
            <button id="btnNext" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold rounded-lg transition shadow-lg shadow-indigo-600/30">Suivant →</button>
        </div>
    </div>

    <!-- Import Map pour charger Three.js et ses addons via ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <!-- Script Logique 3D & UI -->
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuration de la scène, de la caméra et du renderer
        const container = document.getElementById('webgl-container');
        const SCENE = new THREE.Scene();
        
        const CAMERA = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        CAMERA.position.set(0, 50, 60);

        const RENDERER = new THREE.WebGLRenderer({ antialias: true });
        RENDERER.setSize(window.innerWidth, window.innerHeight);
        RENDERER.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        RENDERER.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(RENDERER.domElement);

        const CONTROLS = new OrbitControls(CAMERA, RENDERER.domElement);
        CONTROLS.enableDamping = true;

        // Éclairage de la scène
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        SCENE.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(20, 40, 20);
        SCENE.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x90b0ff, 1.0);
        dirLight2.position.set(-20, -20, -20);
        SCENE.add(dirLight2);

        const ROOT = new THREE.Group();
        SCENE.add(ROOT);

        let partsRoot = null;
        let stepIndex = 0;
        const allParts = [];
        const ASSETS = './assets'; // Dossier contenant vos fichiers fc-board.glb et fc-parts.glb

        // Définition des étapes d'assemblage
        const STEPS = [
          { title: "MCU", what: "Microcontrôleur principal", blurb: "Installation du processeur central.", refs: ["U1"] },
          { title: "IMU", what: "Unité de mesure inertielle", blurb: "Capteurs gyroscopes et accéléromètres.", refs: ["U2"] },
          { title: "OSD", what: "On-Screen Display", blurb: "Puce d'affichage vidéo incrustée.", refs: ["U3"] },
          { title: "Power", what: "Gestion d'alimentation", blurb: "Régulateurs de tension et filtrage.", refs: ["U4", "C1"] },
          { title: "Comms", what: "Récepteur / Télémétrie", blurb: "Modules de communication sans fil.", refs: ["U5"] },
          { title: "Connectors", what: "Connecteurs & Pads", blurb: "Soudure des ports externes.", refs: ["J1", "J2"] },
          { title: "Passives", what: "Composants passifs", blurb: "Résistances et condensateurs de découplage.", refs: ["R1", "R2"] },
          { title: "Final", what: "Assemblage complet", blurb: "Vérification finale de la carte.", refs: [] }
        ];

        // Chargement des modèles GLTF
        async function load() {
          const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
          try {
            const [bRes, pRes] = await Promise.all([
              loader.loadAsync(`${ASSETS}/fc-board.glb`),
              loader.loadAsync(`${ASSETS}/fc-parts.glb`)
            ]);
            
            ROOT.add(bRes.scene);
            partsRoot = pRes.scene;
            ROOT.add(partsRoot);
                
            let meshIndex = 0;
            partsRoot.traverse(o => { 
               if (o.isMesh) {
                   allParts.push(o);
                   o.visible = false;
                   console.log(`Mesh [${meshIndex}] trouvé -> Nom : ${o.name}`);
                   meshIndex++;
               }
            });
             
            showStep(0);
          } catch(e) { 
            console.error("Erreur lors du chargement des modèles GLTF :", e);
            document.getElementById('cWhat').textContent = "Erreur de chargement";
            document.getElementById('cBlurb').textContent = "Vérifiez que le dossier 'assets' et les fichiers .glb sont bien présents.";
          }
        }

        // Fonction de rendu des étapes
        function showStep(idx) {
          stepIndex = idx;
          const s = STEPS[idx];
          
          const pCount = document.getElementById('pCount');
          const barFill = document.getElementById('barFill');
          const cTitle = document.getElementById('cTitle');
          const cWhat = document.getElementById('cWhat');
          const cBlurb = document.getElementById('cBlurb');
          const btnBack = document.getElementById('btnBack');
          const btnNext = document.getElementById('btnNext');

          if (pCount) pCount.textContent = `${idx + 1}/${STEPS.length}`;
          if (barFill) barFill.style.width = `${((idx + 1) / STEPS.length) * 100}%`;
          if (cTitle) cTitle.textContent = s.title;
          if (cWhat) cWhat.textContent = s.what;
          if (cBlurb) cBlurb.textContent = s.blurb;
            
          if (idx === STEPS.length - 1) {
            allParts.forEach(p => p.visible = true);
          } else {
            allParts.forEach(p => p.visible = false);
            
            for (let i = 0; i <= idx; i++) {
                if (STEPS[i].refs) {
                    STEPS[i].refs.forEach(ref => {
                        const node = partsRoot.getObjectByName(ref);
                        if (node) {
                            node.traverse(child => { if (child.isMesh) child.visible = true; });
                        }
                    });
                }
            }
          }
          
          if (btnBack) btnBack.disabled = (idx === 0);
          if (btnNext) btnNext.textContent = (idx === STEPS.length - 1) ? 'Terminé 🏆' : 'Suivant →';
        }

        // Écouteurs d'événements des boutons
        document.getElementById('btnBack').addEventListener('click', () => {
          if (stepIndex > 0) showStep(stepIndex - 1);
        });

        document.getElementById('btnNext').addEventListener('click', () => {
          if (stepIndex < STEPS.length - 1) {
            showStep(stepIndex + 1);
          }
        });

        // Redimensionnement de la fenêtre
        window.addEventListener('resize', () => {
          CAMERA.aspect = window.innerWidth / window.innerHeight;
          CAMERA.updateProjectionMatrix();
          RENDERER.setSize(window.innerWidth, window.innerHeight);
        });

        // Boucle d'animation (Render Loop)
        function animate() {
          requestAnimationFrame(animate);
          CONTROLS.update();
          RENDERER.render(SCENE, CAMERA);
        }
        animate();

        // Lancement de l'application
        load();
    </script>
</body>
</html>
