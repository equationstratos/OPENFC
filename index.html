<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>OpenFC — Build Guide</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f3b2b'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='%23cdd6dc'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --cyan:#00A7E1; --cyan-dim:#0a6d99;
      --accent:#ff7a66;            /* the part currently being placed */
      --accent-soft:#ffb3a5;
      --ok:#37e0a0;
      --ink:#eaf4fb; --dim:#9fc0d6; --faint:#6f96b1;
      --bg:#0b1622; --panel:#0e2236; --line:#1d3d59;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
      font-family:Inter,system-ui,sans-serif;color:var(--ink);
      -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
    canvas{display:block;touch-action:none}
    #viewport{position:fixed;inset:0}

    /* ---------- header ---------- */
    #top{position:fixed;top:0;left:0;right:0;z-index:5;padding:14px 18px 0;
      background:linear-gradient(180deg,#0b1622f2 55%,#0b162200);pointer-events:none}
    #topInner{display:flex;align-items:center;gap:14px;max-width:1240px;margin:0 auto}
    #logo{flex:none;width:44px;height:44px;border-radius:12px;
      background:linear-gradient(160deg,#22c5ff,#0a6d99);color:#04222f;
      display:grid;place-items:center;font-size:21px;box-shadow:0 6px 18px #00a7e155}
    #ttl{flex:1;min-width:0}
    #ttl b{display:block;font-size:15px;letter-spacing:.2px}
    #ttl span{display:block;font-size:12.5px;color:var(--dim);margin-top:1px}
    #prog{flex:none;text-align:right}
    #prog b{font-size:19px;font-weight:800}
    #prog span{display:block;font-size:11px;color:var(--dim);letter-spacing:.4px}
    #bar{max-width:1240px;margin:11px auto 0;height:5px;border-radius:4px;background:#16304a;overflow:hidden}
    #barFill{height:100%;width:0;border-radius:4px;
      background:linear-gradient(90deg,var(--cyan),var(--ok));transition:width .45s cubic-bezier(.4,0,.2,1)}

    /* ---------- info card ---------- */
    #card{position:fixed;left:18px;bottom:18px;z-index:6;width:420px;max-width:calc(100vw - 36px);
      background:#0e2236f2;backdrop-filter:blur(14px);
      border:1px solid var(--line);border-left:4px solid var(--accent);
      padding:19px 20px 17px;border-radius:16px;box-shadow:0 18px 44px #0009;
      max-height:calc(100vh - 190px);overflow-y:auto;overscroll-behavior:contain;
      /* fade the last line so it reads as "there is more below" */
      mask-image:linear-gradient(180deg,#000 calc(100% - 26px),transparent);
      -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 26px),transparent)}
    #card::-webkit-scrollbar{width:6px}
    #card::-webkit-scrollbar-thumb{background:#24506f;border-radius:3px}
    #cHead{display:flex;gap:12px;align-items:flex-start;margin-bottom:11px}
    #cIcon{flex:none;width:34px;height:34px;border-radius:10px;background:#12395a;
      display:grid;place-items:center;font-size:17px;border:1px solid #23557d}
    #cTitle{margin:0;font-size:1.18rem;font-weight:800;line-height:1.25;letter-spacing:-.2px}
    #cWhat{color:var(--cyan);font-weight:700;font-size:.79rem;margin-top:3px;letter-spacing:.1px}
    #cBlurb{font-size:.875rem;color:#c3d9e8;line-height:1.62;margin:0}
    #cBlurb b{color:#fff;font-weight:700}
    #cBlurb em{color:var(--accent-soft);font-style:normal;font-weight:600}
    #cTags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
    .tag{font-size:10px;font-weight:800;letter-spacing:.7px;padding:4px 9px;border-radius:6px;
      background:#12395a;color:#8fd0f2;border:1px solid #1e4d73}
    .tag.face{background:#3a2318;color:#ffb99f;border-color:#5c3626}
    #cRefs{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.665rem;color:var(--faint);
      margin-top:11px;line-height:1.65;word-break:break-word;border-top:1px solid #17334c;padding-top:9px}
    #cRefs i{color:#547d99;font-style:normal}

    /* ---------- controls ---------- */
    #ctl{position:fixed;right:18px;bottom:18px;z-index:6;display:flex;gap:8px;align-items:center}
    #tools{position:fixed;right:18px;top:84px;z-index:6;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
    .btn{border:1px solid #244863;background:#102a40e0;backdrop-filter:blur(8px);color:var(--ink);
      border-radius:10px;padding:11px 15px;font:800 13px Inter,sans-serif;cursor:pointer;
      display:inline-flex;align-items:center;gap:7px;transition:.16s}
    .btn:hover:not(:disabled){background:#1a3d5ae0;border-color:#3570a0}
    .btn:disabled{opacity:.35;cursor:default}
    .btn.pri{background:linear-gradient(180deg,#0d8cc4,#0a6d99);border-color:#12a0dd;color:#fff}
    .btn.pri:hover{background:linear-gradient(180deg,#14a0dd,#0c7cae)}
    .btn.on{background:#0d5f7ee0;border-color:var(--cyan);color:#9de4ff}
    .sm{padding:9px 12px;font-size:12px}
    #face{position:fixed;left:50%;top:88px;transform:translateX(-50%);z-index:6;
      font:800 11px Inter,sans-serif;letter-spacing:1.1px;padding:6px 14px;border-radius:20px;
      background:#102a40cc;border:1px solid #2a5b82;color:#8fd0f2;backdrop-filter:blur(8px);
      pointer-events:none;transition:.25s}

    /* ---------- 3D callout labels ---------- */
    #labels{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
    #leaders{position:absolute;inset:0;width:100%;height:100%}
    .lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
      font:800 14px Inter,sans-serif;letter-spacing:-.1px;padding:5px 12px;border-radius:9px;
      background:#0b1622ee;border:2px solid var(--accent);color:#fff;
      box-shadow:0 4px 16px #0008;opacity:0;transition:opacity .3s}
    .lbl small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.6px;
      color:var(--accent-soft);margin-top:1px}

    #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;
      font-size:11.5px;color:var(--faint);pointer-events:none;transition:opacity .5s}
    #load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg);
      font-size:13px;color:var(--dim);transition:opacity .5s}

    @media (max-width:900px){
      #card{width:auto;right:18px;max-height:44vh;font-size:13px}
      #tools{top:76px}
      #ctl{left:18px;justify-content:flex-end}
      .lbl{font-size:12px;padding:4px 9px}
    }
  </style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const ASSETS = './assets/openfc-visualizer';

/* ==========================================================================
   Guide content.

   `group` refers to the `step` field in parts-map.json: that is what decides
   which components light up at this step. `labels` are the callouts pinned in
   the 3D view — deliberately few of them, so they stay readable.
   ========================================================================== */
const STEPS = [
  {
    group:null, icon:'▢',
    title:"Four holes and a lot of copper",
    what:"The bare PCB — the skeleton",
    html:`It starts as a square of glass-reinforced epoxy, <b>37.9 mm a side</b> and
      <b>0.94 mm</b> thick. The four <b>Ø4 mm</b> holes are not placed casually: their
      centres form a <b>30.5 × 30.5 mm</b> square, the mounting standard that nearly
      every 5-inch-and-up quad uses. They take rubber <b>soft-mounts</b>, and that
      detail is as electrical as it is mechanical — they damp frame vibration before
      it ever reaches the gyro. Inside the laminate, copper is stacked in layers: the
      outer faces carry the traces, the inner ones are <b>solid planes</b>. That ground
      plane is the most important part on the board even though it appears on no bill
      of materials — it is the <em>return path</em> for every current, and the
      <em>shield</em> between the switching regulators and the sensor. Parts sit on
      <b>both sides</b>: 39 on the front, 72 on the back.`,
    tags:['PCB','BOTH SIDES'],
    refs:'30.5 × 30.5 mm · Ø4.0 mm · 0.94 mm thick · 37.9 × 37.9 mm'
  },
  {
    group:'rails', icon:'⚡',
    title:"Two choppers, two rails",
    what:"The buck converters — the power stage",
    html:`A drone battery is not a clean supply: a 4S pack sags from <b>16.8 V to 13 V</b>
      the moment you punch the throttle, with a spike on every motor commutation.
      Nothing digital tolerates that. Two <b>step-down converters</b> handle it —
      <b>U6</b> and <b>U16</b>, SOT-23-6 packages 2.9 × 1.6 mm. The trick: a transistor
      inside <em>chops</em> the input at a few hundred kilohertz. Each pulse pushes
      current into an <b>inductor</b> — <b>L2</b> and <b>L3</b>, two 3 × 3 mm shielded
      blocks — which <em>stores the energy in a magnetic field</em> and hands it back
      while the transistor is off. Because the energy is moved rather than burned,
      efficiency runs past <b>90 %</b>. The 0805 and 0603 capacitors (C22/C23, C26/C27)
      flank each inductor: they supply the current spikes that the input trace, with
      its own parasitic inductance, cannot deliver fast enough. Each stage has its own
      tell-tale — <b>D4</b> and <b>D5</b>, mounted directly opposite on the other side.`,
    tags:['POWER','BACK SIDE'],
    labels:[['L2','STAGE 1 · coil + U6'],['L3','STAGE 2 · coil + U16']],
    refs:'U6 U16 · L2 L3 · C22 C23 C26 C27 · D4 D5'
  },
  {
    group:'ldo', icon:'⛉',
    title:"When wasting energy is the point",
    what:"The linear regulators — the clean rails",
    html:`A switcher is efficient but <b>noisy</b>: every commutation injects hash onto
      its rail. To a MEMS gyroscope, which resolves capacitance changes on the order of
      a <b>femtofarad</b>, that noise lands straight in the measurement. Hence
      <b>U15</b>, a 2 × 2 mm WSON-6 placed literally against the inertial sensor.
      An <b>LDO</b> chops nothing: it is a transistor held in its linear region by a
      feedback loop — a <em>variable resistor</em> trimmed continuously to hold the
      output where it belongs. No switching noise at all — but everything it does not
      pass leaves <em>as heat</em>. That is the deliberate trade: throw away a few tens
      of milliwatts to buy a quiet rail. <b>U7</b>, the same package on the other side,
      feeds a different section. The layout rule: the output capacitor has to touch the
      pin — C31 and C42 are less than a millimetre away.`,
    tags:['POWER','BOTH SIDES'],
    labels:[['U15','GYRO LDO'],['U7','LDO']],
    refs:'U7 U15 · C30 C31 C32 C42'
  },
  {
    group:'mcu', icon:'▦',
    title:"Eighty pins under ten millimetres",
    what:"The RP2354B microcontroller",
    html:`The part at the centre, <b>U2</b>, is a <b>QFN-80</b> measuring 10 × 10 mm on a
      <b>0.40 mm pitch</b>: eighty contacts around the perimeter plus a <b>3.4 mm
      thermal pad</b> in the middle that dumps heat into the ground plane. Inside: two
      <b>Cortex-M33 cores at 150 MHz</b>, RAM, and <b>4 MB of flash stacked in the same
      package</b> — precisely what separates the RP2354B from a bare RP2350B. A QFN has
      <em>no visible leads</em>: the contacts live under the body, the joints are made
      blind, and they are inspected by X-ray. Around it sit about thirty tiny parts.
      Every supply pin gets its own <b>decoupling capacitor</b> within two millimetres,
      because a core swinging from 5 to 300 mA in a nanosecond drains the trace long
      before the regulator can respond: the capacitor is the local reservoir that
      carries those few nanoseconds. Flip the board over — a whole column of 0201s is
      mounted <em>on the back, underneath the package</em>, tied through vias. It is the
      shortest path there is.`,
    tags:['COMPUTE','BOTH SIDES'],
    labels:[['U2','RP2354B · QFN-80']],
    refs:'U2 + 31 passives · C1…C17 R1…R30 Q1 Q2'
  },
  {
    group:'coresmps', icon:'◎',
    title:"An inductor just for the core",
    what:"The RP2350's built-in regulator",
    html:`A detail few boards make visible: the RP2350 carries <b>its own switching
      regulator</b> for the 1.1 V core, and that regulator needs an <b>external
      inductor</b>. This is <b>L1</b> — 3.3 µH in a 2016 package (2.0 × 1.6 mm), sitting
      three millimetres from the chip with <b>C19</b> and <b>C20</b> for input and
      output. The constraint is the one every switcher has: the <em>commutation loop</em>
      formed by the inductor, the capacitor and the chip's pins must be as small as
      possible. Every square millimetre it encloses is an antenna — and this antenna
      would be radiating a couple of centimetres from the gyro and the radio link. Here
      the loop measures under five millimetres around.`,
    tags:['COMPUTE','FRONT SIDE'],
    labels:[['L1','CORE SMPS · 3.3 µH']],
    refs:'L1 · C9 C19 C20 · R10 R11'
  },
  {
    group:'clock', icon:'◈',
    title:"A rock that vibrates",
    what:"The crystal — the time reference",
    html:`<b>X1</b> is a four-pad crystal, 2.5 × 2.0 mm. Inside is a sliver of quartz cut
      to shape that <b>vibrates mechanically</b> the moment a voltage is applied to it —
      the piezoelectric effect — at a frequency fixed by that cut, here <b>12 MHz</b>,
      stable to a few tens of parts per million. The microcontroller's <b>PLL</b> then
      multiplies it up to the 150 MHz core clock and the USB clock. Without it there is
      no USB at all: the protocol allows <b>±0.25 %</b>, far tighter than any internal
      RC oscillator holds. Look where it is mounted: <em>on the back, directly beneath
      the microcontroller</em>. That is not wasted real estate, it is the shortest
      possible run between the crystal and its two pins — a few millimetres of trace and
      two vias. A clock line that crosses the board picks up noise and radiates it, so
      you keep it short and surround it with ground.`,
    tags:['CLOCK','BACK SIDE'],
    labels:[['X1','12 MHz CRYSTAL']],
    refs:'X1 · C8 C11 C18'
  },
  {
    group:'imu', icon:'◉',
    title:"Six axes in three millimetres",
    what:"The BMI270 IMU — the inner ear",
    html:`<b>U9</b>, an <b>LGA-14 measuring 3.0 × 2.5 mm</b>, is the one part without
      which a drone cannot fly. It holds two <b>MEMS</b> sensors etched into silicon.
      The <b>gyroscope</b>: microscopic masses driven into vibration, whose deflection
      under the <em>Coriolis force</em> is measured the instant the board rotates — that
      is angular rate, on three axes, thousands of times a second. The
      <b>accelerometer</b>: three masses hung on silicon springs, their displacement read
      as a change in capacitance. The gyro is fast but it <em>drifts</em>; the
      accelerometer is noisy but it knows which way is down. Fusing the two yields an
      attitude that is both quick and stable. It is the gyro reading that the PID loop
      compares against your stick position, every single cycle. Two mounting rules: put
      it <b>near the centre of the board</b> so it reads rotation rather than centrifugal
      acceleration, and give it <b>its own regulator</b> — that is U15, a millimetre
      away.`,
    tags:['SENSOR','FRONT SIDE'],
    labels:[['U9','BMI270 · LGA-14']],
    refs:'U9 · C33 C34 · SPI to U2'
  },
  {
    group:'boot', icon:'⏻',
    title:"The button that turns the board into a flash drive",
    what:"The BOOTSEL contact",
    html:`<b>U1</b> is nothing more than a four-pin momentary switch, 3 × 2 mm. Its job
      fits in one sentence: force the state of a pin <em>at the exact moment the
      microcontroller starts</em>. The RP2350 samples that pin at power-up; if it is
      held at the right level, the chip <b>does not run the program</b> in flash and
      boots its internal ROM instead. The board then appears on your computer as a
      <b>USB mass-storage device</b>: you drag a <b>.uf2</b> file onto it and the
      firmware is written. This is the project's safety net. Whatever state the embedded
      software is in — corrupted outright, hung on the first cycle — the firmware is
      recoverable with one button and a drag-and-drop, no programmer, not a wire
      soldered.`,
    tags:['BRING-UP','FRONT SIDE'],
    labels:[['U1','BOOT BUTTON']],
    refs:'U1 · C21 R9'
  },
  {
    group:'status', icon:'✳',
    title:"Five LEDs, five answers",
    what:"The status indicators",
    html:`Five LEDs in <b>0402</b> packages — one millimetre by half. Each one sits in
      series with its own <b>current-limiting resistor</b>, and that is the only correct
      way to wire an LED: a diode has a nearly fixed forward voltage, so connect one
      straight across a rail and it is the <em>current</em> that runs away and destroys
      it. The resistor sets that current. The pairs are visible by eye in the model:
      <b>D9/R39</b>, <b>D1/R16</b>, <b>D7/R28</b>, in a column beside the
      microcontroller. The other two, <b>D4</b> and <b>D5</b>, are out in the corners,
      each facing one of the converters — those are the rail indicators. On a finished
      board these five points of light are the first diagnostic you have: in one second
      they tell you whether the supply came up, whether the firmware is running and
      whether the link is alive — before you have plugged in a computer at all.`,
    tags:['DIAGNOSTICS','FRONT SIDE'],
    labels:[['D1','LED + RESISTOR']],
    refs:'D1 D7 D9 · R16 R28 R39 · C10'
  },
  {
    group:'sense', icon:'∿',
    title:"The quiet corner",
    what:"The analog service block — sensing and protection",
    html:`In the back right corner sits a compact group that is easy to miss:
      <b>U11</b> (SOT-23-5), <b>U10</b> (X2SON-6, 1.0 × 0.8 mm), <b>U12</b> (X2SON-4,
      0.8 × 0.8 mm), the diode <b>D8</b>, and a dozen 0201 resistors including two
      perfectly aligned rows of three. Those alignments are a signature: three resistors
      in a file is the geometry of a <b>voltage divider</b>. The principle is elementary
      and everywhere — two resistors in series between the voltage you want to measure
      and ground, with the midpoint, carrying a fixed fraction of it, running off to an
      <b>analog-to-digital converter</b> on the microcontroller. That is exactly how an
      OSD shows you "15.8 V": it never measures the battery, it measures a tenth of the
      battery and multiplies by ten.
      <br><br><i style="color:#7fa8c4">On what is certain here: the exported model gives
      the package, the designator and the position — not the part number. The analog
      service role is legible in the geometry; the silicon inside is not.</i>`,
    tags:['ANALOG','BACK SIDE'],
    labels:[['U11','SOT-23-5'],['U10','X2SON-6']],
    refs:'U10 U11 U12 D8 · R31…R35 · C36…C40'
  },
  {
    group:'usb', icon:'⇄',
    title:"Sixteen contacts and two resistors",
    what:"The USB-C port",
    html:`<b>USB1</b> is a <b>16-contact USB-C</b> receptacle soldered at the board edge —
      the tallest part on the assembly at 3.9 mm. Two details are worth the detour.
      First, <b>reversibility</b>: the connector is symmetric, so every function exists
      twice and the board has to <em>work out which way round</em> the cable went in.
      That is the job of the <b>CC1</b> and <b>CC2</b> pins, and of <b>R3</b> and
      <b>R4</b> — two <b>5.1 kΩ resistors to ground</b>, placed three millimetres from
      the receptacle. Those two resistors do three things at once: they announce "I am a
      device", they tell the source how much current it may deliver, and they reveal
      which data pair is live. Without them a modern USB-C charger supplies
      <em>nothing at all</em> — the classic failure on a first home-made board. Second,
      the <b>shield</b>: the metal body is anchored by through-hole legs, both for
      mechanical strength — this is the connector that gets yanked — and to route
      electrostatic discharge to ground instead of into the microcontroller.`,
    tags:['I/O','BACK SIDE'],
    labels:[['USB1','USB-C 16P'],['R3','CC · 5.1 kΩ']],
    refs:'USB1 · R3 R4 (CC1/CC2) · R36 R37 R38'
  },
  {
    group:'sd', icon:'▤',
    title:"The black box",
    what:"The microSD socket — the flight recorder",
    html:`<b>Card1</b> is by a wide margin the largest part on the board:
      <b>15 × 16 mm</b>, close to a sixth of the total area. It is a <b>push-push</b>
      microSD holder — push to insert, push again to eject; inside, a spring and a
      <em>heart-shaped cam</em>, the same mechanism as a retractable pen. Its purpose is
      the drone equivalent of an aircraft's black box: through the flight, the
      microcontroller writes out every stick command, all three gyro axes, the output of
      each PID term and the value sent to each motor, dozens of times a second.
      Afterwards those traces overlay on one another — and that is the only serious way
      to work out <b>why</b> a quad oscillates, rather than turning tuning knobs at
      random. The mounting constraint is mechanical before it is electrical: the shield
      has to be soldered to broad copper areas, because every card insertion pushes on

/* ========================================================================== */
const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
$('viewport').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1622);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.minDistance = 0.6;
controls.maxDistance = 6;
controls.autoRotateSpeed = 1.1;

scene.add(new THREE.HemisphereLight(0xd8ecff, 0x1b2b3a, 0.55));
const key = new THREE.DirectionalLight(0xfff2e2, 1.5);
key.position.set(2.2, 3.2, 2.6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9fd8ff, 0.55);
fill.position.set(-2.6, -1.4, 1.6);
scene.add(fill);
scene.add(camera);
const rim = new THREE.DirectionalLight(0xffffff, 0.42);
rim.position.set(0, 0, 1);
camera.add(rim);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* PIVOT turns about the board's geometric centre; MODEL carries the recentring
   and the scale. Keeping them apart is what lets Flip spin the board on itself
   instead of swinging it out of frame. */
const PIVOT = new THREE.Group();
const MODEL = new THREE.Group();
PIVOT.add(MODEL);
scene.add(PIVOT);

const OUTLINES = new THREE.Group();
OUTLINES.renderOrder = 999;
PIVOT.add(OUTLINES);

let partsMap = null;        // parts-map.json
let byRef = new Map();      // refdes    -> component
let meshOf = new Map();     // glTF name -> mesh
let boardMesh = null;
let stepIndex = 0;
let flipped = false;        // true = we are looking at the back side
let xray = false;
let boardMM = { centre:new THREE.Vector3(), size:new THREE.Vector3(), scale:1 };

const ACCENT = new THREE.Color(0xff7a66);
const GHOST  = new THREE.Color(0x5d7488);
const MARK   = new THREE.Color(0x8a8a8a);

/* The card owns the left edge (the bottom on a narrow screen), so shift the
   projection to keep the board centred in whatever space is left. */
function applyViewOffset(){
  const w = innerWidth, h = innerHeight;
  const wide = w >= 900;
  camera.setViewOffset(w, h, wide ? -Math.min(215, (w-720)/2) : 0, wide ? 0 : 74, w, h);
}

/* ---------- materials ----------------------------------------------------
   KiCad exports everything as flat colour: metalness 0, roughness 1, and the
   same grey for a ceramic capacitor, a steel shield and an epoxy package. The
   footprint name says what the part actually is, and `role` (from
   parts-map.json) says whether a given solid is the body, a lead, a shell or
   moulded-in lettering -- enough to paint each one the way it looks in life.
   -------------------------------------------------------------------------- */
const SOLDER = 0xccd2d8;                 // tinned lead / termination
const PALETTE = [
  // MLCC: pale tan ceramic. Easily the biggest visual change -- 42 of them
  [/^C_\d/,        { body:0xb99a72, rough:0.54, metal:0.04, lead:SOLDER }],
  // thick-film chip resistor: dark top face over a white alumina substrate
  [/^R_\d/,        { body:0x2b2b30, rough:0.48, metal:0.05, lead:SOLDER }],
  // an unlit LED shows its phosphor, not the colour it emits
  [/^LED_/,        { body:0xe6d6ab, rough:0.33, metal:0.0,  lead:SOLDER, glow:0x2b1e07 }],
  // moulded power inductor: matte iron-powder composite
  [/^IND-SMD/,     { body:0x3b3b41, rough:0.8,  metal:0.16, lead:SOLDER }],
  // crystal: nickel-plated lid seam-welded to a ceramic base
  [/^CRYSTAL/,     { body:0xd3d8de, rough:0.27, metal:0.9,  lead:SOLDER }],
  // microSD: black plastic frame under a drawn stainless cage
  [/^TF-SMD/,      { body:0x1d1d21, rough:0.55, metal:0.05, lead:SOLDER,
                     shell:0xc9ced5, shellRough:0.25, shellMetal:0.93 }],
  [/^USB-TYPE-C/,  { body:0xc9ced5, rough:0.26, metal:0.93, lead:SOLDER }],
  // JST-SH shrouds are natural nylon; the contacts are gold-flashed
  [/^CONN-SMD/,    { body:0xe4dfd2, rough:0.62, metal:0.03, lead:0xc8a24a }],
  // tact switch: black moulding around a stainless dome
  [/^SW-SMD/,      { body:0x1f1f22, rough:0.44, metal:0.05, lead:SOLDER }],
  [/^SOD-|^X3-DFN/,{ body:0x232327, rough:0.4,  metal:0.08, lead:SOLDER }],
];
// QFN, LGA, SOT-23, SOT-583, WSON, X2SON, DFN: moulded black epoxy
const EPOXY = { body:0x1c1c20, rough:0.43, metal:0.06, lead:SOLDER };

const skinOf = fp => (PALETTE.find(([re]) => re.test(fp)) || [null, EPOXY])[1];

function dressMaterial(mesh, comp, role){
  const m = mesh.material;
  m.side = THREE.FrontSide;
  m.envMapIntensity = 1.15;

  if (!comp){                                    // the bare PCB
    m.color.setHex(0x105c39);
    m.roughness = 0.6; m.metalness = 0.04;
    // KiCad's smoothed normals ripple across what is a dead-flat laminate
    m.flatShading = true;
  } else {
    const skin = skinOf(comp.fp);
    if (role === 'shell'){
      m.color.setHex(skin.shell ?? skin.body);
      m.roughness = skin.shellRough ?? skin.rough;
      m.metalness = skin.shellMetal ?? skin.metal;
    } else if (role === 'lead'){
      m.color.setHex(skin.lead);
      m.roughness = 0.34; m.metalness = 0.82;
    } else if (role === 'mark'){
      // moulded lettering: shift toward mid-grey so it reads on a body of
      // any darkness, instead of picking one colour that vanishes on half
      m.color.setHex(skin.body).lerp(MARK, 0.4);
      m.roughness = Math.min(1, skin.rough + 0.15);
      m.metalness = skin.metal;
    } else {
      m.color.setHex(skin.body);
      m.roughness = skin.rough; m.metalness = skin.metal;
      if (skin.glow) m.emissive.setHex(skin.glow);
    }
  }
  mesh.userData.base = {
    color: m.color.clone(),
    emissive: m.emissive.clone(),
    roughness: m.roughness,
    metalness: m.metalness
  };
}

function setState(mesh, state){
  const m = mesh.material, b = mesh.userData.base;
  mesh.visible = state !== 'hidden';
  if (state === 'hidden') return;

  m.transparent = (state === 'ghost');
  m.depthWrite  = (state !== 'ghost');
  m.opacity     = (state === 'ghost') ? 0.26 : 1;
  m.color.copy(b.color);
  m.emissive.copy(b.emissive);
  m.roughness = b.roughness;
  m.metalness = b.metalness;

  if (state === 'active'){
    m.color.lerp(ACCENT, 0.88);
    m.emissive.setHex(0x7a2615);
    m.metalness = Math.min(b.metalness, 0.22);
    m.roughness = 0.38;
  } else if (state === 'ghost'){
    // a coloured ghost competes with the part being placed
    m.color.lerp(GHOST, 0.7);
    m.emissive.setHex(0x000000);
    m.metalness = 0.1; m.roughness = 0.7;
  }
  m.needsUpdate = true;
}

function setBoardState(ghost){
  if (!boardMesh) return;
  const m = boardMesh.material;
  m.transparent = ghost;
  m.depthWrite  = !ghost;
  m.opacity     = ghost ? 0.5 : 1;
  // dark and translucent against a dark backdrop the PCB disappears, taking
  // the components' frame of reference with it
  m.color.setHex(ghost ? 0x2a7d5e : 0x105c39);
  m.needsUpdate = true;
}

/* ---------- loading ---------- */
async function load(){
  const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  const [board, parts, map] = await Promise.all([
    loader.loadAsync(`${ASSETS}/fc-board.glb`),
    loader.loadAsync(`${ASSETS}/fc-parts.glb`),
    fetch(`${ASSETS}/parts-map.json`).then(r => {
      if (!r.ok) throw new Error(`parts-map.json: ${r.status}`);
      return r.json();
    })
  ]);

  partsMap = map;
  for (const c of map.components) byRef.set(c.ref, c);

  // every solid needs to know which component it belongs to before it can be
  // painted: the footprint decides the material, the role decides the part of it
  const owner = new Map();
  for (const c of map.components)
    for (const [name, role] of Object.entries(c.meshes)) owner.set(name, [c, role]);

  MODEL.add(board.scene, parts.scene);
  board.scene.traverse(o => { if (o.isMesh){ boardMesh = o; dressMaterial(o, null, 'board'); } });
  parts.scene.traverse(o => {
    if (!o.isMesh) return;
    meshOf.set(o.name, o);
    const [comp, role] = owner.get(o.name) || [null, 'body'];
    dressMaterial(o, comp, role);
  });

  // centre on the bare PCB rather than the connector envelope: the board's own
  // centre is the natural point to turn it about
  const box = new THREE.Box3().setFromObject(board.scene);
  const centre = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const S = 1 / Math.max(size.x, size.y);
  MODEL.scale.setScalar(S);
  MODEL.position.copy(centre).multiplyScalar(-S);
  boardMM = { centre, size, scale:S };

  const missing = map.components.filter(c => Object.keys(c.meshes).some(n => !meshOf.has(n)));
  if (missing.length) console.warn('meshes missing from the GLB:', missing.map(c => c.ref));

  $('load').style.opacity = 0;
  setTimeout(() => $('load').remove(), 500);
  showStep(0, true);
}

/* ---------- model space (mm) to world ---------- */
const _v = new THREE.Vector3();
function toWorld(xmm, ymm, zmm, flipY){
  _v.set(xmm/1000, ymm/1000, zmm/1000)
    .sub(boardMM.centre).multiplyScalar(boardMM.scale);
  if (flipY) _v.set(-_v.x, _v.y, -_v.z);   // a π rotation about Y
  return _v.clone();
}
function centreOf(c, flipY){
  return toWorld((c.bb[0][0]+c.bb[1][0])/2, (c.bb[0][1]+c.bb[1][1])/2,
                 (c.bb[0][2]+c.bb[1][2])/2, flipY);
}

/* ---------- outline around the part being placed ---------- */
const outlineMat = new THREE.LineBasicMaterial({ color:0xff7a66, transparent:true, opacity:0.9, depthTest:false });
function drawOutlines(comps){
  OUTLINES.clear();
  for (const c of comps){
    const [lo, hi] = c.bb;
    const g = new THREE.BoxGeometry(
      Math.max(hi[0]-lo[0], 0.35)/1000, Math.max(hi[1]-lo[1], 0.35)/1000, Math.max(hi[2]-lo[2], 0.2)/1000);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g), outlineMat);
    const p = new THREE.Vector3((lo[0]+hi[0])/2/1000, (lo[1]+hi[1])/2/1000, (lo[2]+hi[2])/2/1000)
      .sub(boardMM.centre).multiplyScalar(boardMM.scale);
    edges.position.copy(p);
    edges.scale.multiplyScalar(boardMM.scale * 1.14);
    edges.renderOrder = 999;
    OUTLINES.add(edges);
  }
}

/* ---------- labels ---------- */
const labelEls = [];
function buildLabels(step){
  const host = $('labels'), svg = $('leaders');
  labelEls.length = 0;
  host.querySelectorAll('.lbl').forEach(e => e.remove());
  svg.innerHTML = '';
  for (const [ref, text] of (step.labels || [])){
    const c = byRef.get(ref);
    if (!c) continue;
    const el = document.createElement('div');
    el.className = 'lbl';
    el.innerHTML = `${ref}<small>${text}</small>`;
    host.appendChild(el);
    const line = document.createElementNS('http://www.w3.org/2000/svg','path');
    line.setAttribute('stroke', '#ff7a66');
    line.setAttribute('stroke-width', '2');
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(line);
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('r', '3.5');
    dot.setAttribute('fill', '#ff7a66');
    svg.appendChild(dot);
    labelEls.push({ el, line, dot, comp:c });
  }
  requestAnimationFrame(() => labelEls.forEach(l => l.el.style.opacity = 1));
}

const _p = new THREE.Vector3();
function positionLabels(){
  if (!labelEls.length) return;
  const w = innerWidth, h = innerHeight;
  const top = 146, bottom = h - 118;     // below the header, above the buttons
  const hubX = w/2 + (w >= 900 ? 215 : 0);
  const hubY = h/2 - (w >= 900 ? 0 : 74);

  // project every part first…
  const shots = labelEls.map(l => {
    const [lo, hi] = l.comp.bb;
    _p.set((lo[0]+hi[0])/2/1000, (lo[1]+hi[1])/2/1000, (lo[2]+hi[2])/2/1000);
    MODEL.localToWorld(_p).project(camera);
    return { l, sx:(_p.x*0.5+0.5)*w, sy:(-_p.y*0.5+0.5)*h, behind:_p.z > 1 };
  });
  // …then lay them out top to bottom, so label order follows part order and
  // the leader lines cannot cross
  shots.sort((a, b) => a.sy - b.sy);

  const placed = [];
  for (const s of shots){
    const dx = s.sx - hubX, dy = s.sy - hubY;
    const len = Math.hypot(dx, dy) || 1;
    let lx = s.sx + dx/len * 150;
    let ly = s.sy + dy/len * 108;
    lx = Math.max(w >= 900 ? 470 : 80, Math.min(w-100, lx));
    ly = Math.max(top, ly);
    // placed in order, so pushing down is enough
    for (const q of placed){
      if (Math.abs(lx-q.x) < 168 && ly < q.y + 44) ly = q.y + 44;
    }
    placed.push({ x:lx, y:ly });
  }
  // if the stack overflows, lift the whole column — but never by more than the
  // headroom above it, or the shift folds labels back onto each other instead
  // of spacing them out
  const overflow = Math.max(...placed.map(q => q.y)) - bottom;
  const headroom = Math.min(...placed.map(q => q.y)) - top;
  const shift = Math.min(Math.max(overflow, 0), Math.max(headroom, 0));
  if (shift) for (const q of placed) q.y -= shift;

  shots.forEach((s, i) => {
    const { x:lx, y:ly } = placed[i];
    const shown = s.behind ? 0 : 1;
    s.l.el.style.left = lx+'px';
    s.l.el.style.top  = ly+'px';
    s.l.el.style.opacity = shown;
    s.l.line.setAttribute('opacity', shown * 0.85);
    s.l.dot.setAttribute('opacity', shown);
    s.l.dot.setAttribute('cx', s.sx);
    s.l.dot.setAttribute('cy', s.sy);
    // a horizontal elbow then a run to the part reads better than one diagonal
    const elbow = lx + (s.sx > lx ? 34 : -34);
    s.l.line.setAttribute('d', `M ${lx} ${ly} L ${elbow} ${ly} L ${s.sx} ${s.sy}`);
  });
}

/* ---------- navigation ---------- */
function componentsFor(step){
  if (!partsMap) return [];
  if (step.group === '*') return partsMap.components;
  if (!step.group) return [];
  return partsMap.components.filter(c => c.step === step.group);
}
function installedBefore(idx){
  const done = new Set();
  for (let i = 0; i < idx; i++){
    const g = STEPS[i].group;
    if (!g) continue;
    if (g === '*'){ partsMap.components.forEach(c => done.add(c.ref)); continue; }
    componentsFor(STEPS[i]).forEach(c => done.add(c.ref));
  }
  return done;
}

function showStep(idx, instant){
  stepIndex = idx;
  const s = STEPS[idx];
  // the last step installs nothing: it shows the board as it leaves the oven, in
  // normal materials — highlighting all of it would teach nothing
  const finale = s.group === '*';
  const active = finale ? [] : componentsFor(s);
  const done = finale ? new Set(partsMap.components.map(c => c.ref)) : installedBefore(idx);
  const activeRefs = new Set(active.map(c => c.ref));

  // fiche
  $('pCount').textContent = `${idx+1}/${STEPS.length}`;
  $('barFill').style.width = `${((idx+1)/STEPS.length)*100}%`;
  $('cIcon').textContent = s.icon;
  $('cTitle').textContent = s.title;
  $('cWhat').textContent = s.what;
  $('cBlurb').innerHTML = s.html;
  $('cTags').innerHTML = (s.tags||[])
    .map(t => `<span class="tag${/SIDE/.test(t) ? ' face' : ''}">${t}</span>`).join('');
  $('cRefs').innerHTML = s.refs ? `<i>on the board:</i> ${s.refs}` : '';
  $('card').scrollTop = 0;

  // per-mesh state
  for (const c of partsMap.components){
    const state = activeRefs.has(c.ref) ? 'active'
                : done.has(c.ref)       ? 'installed'
                : 'hidden';
    for (const name of Object.keys(c.meshes)){
      const mesh = meshOf.get(name);
      if (mesh) setState(mesh, state);
    }
  }

  // which side are we meant to be looking at?
  const back = active.filter(c => c.back).length;
  const front = active.length - back;
  // "both sides" only when the split is real: two indicator LEDs opposite a
  // power stage are no reason to make the whole PCB translucent
  const bothFaces = !finale && active.length > 0 &&
                    Math.min(front, back) / active.length >= 0.25;
  const wantFlip = active.length ? (back > front) : flipped;

  if (xray || bothFaces){
    setBoardState(true);
    for (const c of partsMap.components){
      if (activeRefs.has(c.ref) || !done.has(c.ref)) continue;
      for (const name of Object.keys(c.meshes)){
        const mesh = meshOf.get(name);
        if (mesh) setState(mesh, 'ghost');
      }
    }
  } else {
    setBoardState(false);
  }

  $('face').textContent = finale ? 'BOARD COMPLETE — 111 PARTS'
    : !s.group ? 'BARE BOARD — BEFORE ASSEMBLY'
    : bothFaces ? 'BOTH SIDES — use Flip'
    : wantFlip ? 'BACK SIDE — connectivity' : 'FRONT SIDE — compute';

  drawOutlines(active.filter(c => Object.keys(c.meshes).length && (c.bb[1][0]-c.bb[0][0]) > 0));
  buildLabels(s);

  if (wantFlip !== flipped) setFlip(wantFlip, instant);
  frameOn(active, wantFlip, instant);

  $('btnBack').disabled = (idx === 0);
  $('btnNext').textContent = (idx === STEPS.length-1) ? '↺ Start over' : 'Next →';
}

/* Flip the board on itself: a π rotation about PIVOT's vertical axis, which
   already sits at the geometric centre of the PCB. */
function setFlip(next, instant){
  flipped = next;
  const to = flipped ? Math.PI : 0;
  if (instant) PIVOT.rotation.y = to;
  else gsap.to(PIVOT.rotation, { y:to, duration:0.95, ease:'power3.inOut' });
}

/* Never tighten in far enough to lose the board: knowing *where* a component
   sits matters as much as seeing it. Framing keeps nearly the whole PCB in
   view and only drifts toward the active area — the highlight and the label
   are what single the part out. */
function frameOn(comps, willFlip, instant){
  const centre = new THREE.Vector3();
  let spread = 1;
  if (comps.length && comps.length < partsMap.components.length){
    const lo = [ Infinity, Infinity, Infinity], hi = [-Infinity,-Infinity,-Infinity];
    for (const c of comps) for (let a=0;a<3;a++){
      lo[a] = Math.min(lo[a], c.bb[0][a]); hi[a] = Math.max(hi[a], c.bb[1][a]);
    }
    centre.copy(toWorld((lo[0]+hi[0])/2, (lo[1]+hi[1])/2, (lo[2]+hi[2])/2, willFlip));
    centre.multiplyScalar(0.30);           // drift toward the area, not onto it
    spread = Math.max(hi[0]-lo[0], hi[1]-lo[1]) / 1000 * boardMM.scale;
  }
  // header and buttons eat ~20 % of the height, so the board has to fit in what
  // is left or it runs off the top and right edges
  const fit = THREE.MathUtils.lerp(1.80, 2.06, THREE.MathUtils.clamp(spread, 0, 1));
  const dist = THREE.MathUtils.clamp(fit, 1.80, 2.06);
  const dir = new THREE.Vector3(0.26, 0.46, 1).normalize();
  const pos = centre.clone().add(dir.multiplyScalar(dist));

  if (instant){
    camera.position.copy(pos); controls.target.copy(centre); controls.update(); return;
  }
  gsap.to(camera.position, { x:pos.x, y:pos.y, z:pos.z, duration:0.95, ease:'power3.inOut' });
  gsap.to(controls.target, { x:centre.x, y:centre.y, z:centre.z, duration:0.95, ease:'power3.inOut',
    onUpdate:() => controls.update() });
}

/* ---------- interactions ---------- */
$('btnNext').onclick = () => showStep(stepIndex < STEPS.length-1 ? stepIndex+1 : 0);
$('btnBack').onclick = () => { if (stepIndex > 0) showStep(stepIndex-1); };
$('btnFlip').onclick = () => setFlip(!flipped);
$('btnReframe').onclick = () => showStep(stepIndex);
$('btnXray').onclick = e => {
  xray = !xray;
  e.currentTarget.classList.toggle('on', xray);
  showStep(stepIndex, true);
};
$('btnSpin').onclick = e => {
  controls.autoRotate = !controls.autoRotate;
  e.currentTarget.classList.toggle('on', controls.autoRotate);
};
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); $('btnNext').click(); }
  if (e.key === 'ArrowLeft')  $('btnBack').click();
  if (e.key.toLowerCase() === 'f') $('btnFlip').click();
});
addEventListener('pointerdown', () => {
  const h = $('hint');
  if (h) { h.style.opacity = 0; setTimeout(() => h.remove(), 600); }
}, { once:true });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  applyViewOffset();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
applyViewOffset();

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  outlineMat.opacity = 0.55 + 0.35*Math.sin(clock.getElapsedTime()*3.1);
  positionLabels();
  renderer.render(scene, camera);
}
animate();

load().catch(err => {
  console.error(err);
  $('load').innerHTML = `<div style="text-align:center">
    <b style="color:#ff7a66">Could not load</b><br><br>
    ${err.message}<br><br>
    <span style="color:#6f96b1">Serve this folder over HTTP — GLB and JSON files<br>
    will not load from a file:// URL.</span></div>`;
});
</script>
</body>
</html>
