<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>OpenFC — Flight Controller Visualizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{ --cyan:#00A7E1; --ok:#37e0a0; --ink:#eaf4fb; --dim:#9fc0d6; }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:#0b1622;font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;}
    #viewport{width:100%;height:100%;position:relative}
    canvas{display:block;touch-action:none}
    #top{position:fixed;top:0;left:0;right:0;z-index:5;padding:14px 18px;background:linear-gradient(180deg,#0b1622f2,#0b162200);pointer-events:none}
    #topInner{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto}
    #logo{flex:none;width:44px;height:44px;border-radius:12px;background:var(--cyan);color:#04222f;display:grid;place-items:center;font-size:22px;box-shadow:0 6px 18px #00a7e155}
    #ttl{flex:1;min-width:0}
    #prog{flex:none;text-align:right;font-size:12px;color:var(--dim)}
    #bar{max-width:1180px;margin:11px auto 0;height:6px;border-radius:4px;background:#16304a;overflow:hidden}
    #barFill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--ok));transition:width .5s}
    #card{position:fixed;left:18px;bottom:18px;z-index:6;width:400px;background:#0e2236f6;border-left:4px solid var(--cyan);padding:20px;border-radius:18px;box-shadow:0 10px 30px #000;max-height:80vh;overflow-y:auto}
    #card h3{margin:0;font-size:1.2rem}
    #card p{font-size:0.9rem;color:var(--dim);line-height:1.5}
    #ctl{position:fixed;right:18px;bottom:18px;z-index:6;display:flex;gap:9px;align-items:center}
    .btn{border:1px solid #244863;background:#102a40e6;color:var(--ink);border-radius:11px;padding:12px 16px;font:800 13.5px Inter;cursor:pointer}
    .btn.pri{background:linear-gradient(180deg,#0d84b8,#0a6d99);color:#fff}
    .sm{padding:10px 12px;font-size:13px}
  </style>
  <!-- Importmap pour Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
      }
    }
  </script>
  <!-- GSAP pour les animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="top">
    <div id="topInner">
      <div id="logo">🚀</div>
      <div id="ttl"><b>OpenFC Build</b><span>Contrôleur de vol Open-Source</span></div>
      <div id="prog"><b id="pCount">1/8</b><br><span>étapes</span></div>
    </div>
    <div id="bar"><div id="barFill"></div></div>
  </div>
  <div id="viewBtns" style="position:fixed;top:80px;right:18px;z-index:6;display:flex;gap:6px">
    <label class="btn sm"><input type="checkbox" id="chkSpin"> Auto-spin</label>
    <button class="btn sm" id="btnFlip">🔄 Flip</button>
  </div>
  <div id="card">
    <h3 id="cTitle">Chargement...</h3>
    <div id="cWhat" style="color:var(--cyan); font-weight:bold; margin-bottom:5px"></div>
    <p id="cBlurb"></p>
    <div id="cRefs" style="font-family:monospace; font-size:0.7rem; color:#6f96b1; margin-top:10px"></div>
  </div>
  <div id="viewport"></div>
  <div id="ctl">
    <button class="btn sm" id="btnReframe">🎯 Reset</button>
    <button class="btn" id="btnBack" disabled>← Back</button>
    <button class="btn pri" id="btnNext">Next →</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const ASSETS = './assets/openfc-visualizer'; 
    const STEPS = [
        {title:'The Heart', what:'MCU (RP2354B)', blurb:'Installation du microcontrôleur principal.'},
        {title:'The Gyro', what:'IMU (BMI270)', blurb:'Installation de l\'unité de mesure inertielle.'},
        {title:'Video/OSD', what:'OSD Chip', blurb:'Circuit d\'incrustation vidéo.'},
        {title:'Blackbox', what:'MicroSD Slot', blurb:'Port carte SD pour les logs.'},
        {title:'Power', what:'Buck & LDO', blurb:'Gestion de l\'alimentation 5V/3.3V.'},
        {title:'Radio', what:'ExpressLRS', blurb:'Module radio intégré.'},
        {title:'Input/Output', what:'USB-C & Pads', blurb:'Connectique et alimentation.'},
        {title:'Final Assembly', what:'Ready to fly', blurb:'Assemblage terminé.'}
    ];

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; 
    renderer.toneMappingExposure = 1.05;
    document.getElementById('viewport').appendChild(renderer.domElement);

    const scene = new THREE.Scene(); 
    scene.background = new THREE.Color(0x0b1622);    

    const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.001, 50);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    scene.add(new THREE.HemisphereLight(0xdcefff, 0x2f3f52, 0.65));
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    scene.add(camera);
    const headLight = new THREE.DirectionalLight(0xfff4e2, 1.2);
    headLight.position.set(0, 0, 1);
    camera.add(headLight);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const ROOT = new THREE.Group(); 
    scene.add(ROOT);    

    let partsRoot = null;
    let allMeshes = [];
    let stepIndex = 0, flipped = false;

    async function load() {
      const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
      try {
        const [bRes, pRes] = await Promise.all([
          loader.loadAsync(`${ASSETS}/fc-board.glb`),
          loader.loadAsync(`${ASSETS}/fc-parts.glb`)
        ]);
                
        ROOT.add(bRes.scene);
        partsRoot = pRes.scene;
        ROOT.add(partsRoot);

        // Collecte robuste de tous les meshes enfants (même profondément imbriqués)
        allMeshes = [];
        partsRoot.traverse(o => {
          if (o.isMesh) {
            allMeshes.push(o);
            o.visible = false; // Cachés au départ pour l'animation par étapes
            // S'assure que les matériaux réagissent bien à l'éclairage studio
            if (o.material) {
              o.material.roughness = Math.min(Math.max(o.material.roughness, 0.1), 0.9);
            }
          }
        });

        console.log(`Modèles chargés avec succès. ${allMeshes.length} pièces détectées.`);

        // Centrage automatique du modèle global
        const box = new THREE.Box3().setFromObject(ROOT);
        const centre = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        ROOT.position.sub(centre); 
        controls.target.set(0, 0, 0);
        camera.position.set(0, maxDim * 1.0, maxDim * 2.5);
        controls.update();

        showStep(0);
      } catch (err) {
        console.error("Erreur lors du chargement des modèles 3D :", err);
        document.getElementById('cTitle').textContent = "Erreur de chargement";
        document.getElementById('cBlurb').textContent = "Vérifiez la console et le chemin des fichiers GLB.";
      }
    }  

    function showStep(idx) {
      stepIndex = idx;
      const s = STEPS[idx];
      document.getElementById('pCount').textContent = `${idx + 1}/8`;
      document.getElementById('barFill').style.width = `${((idx+1)/8)*100}%`;
      document.getElementById('cTitle').textContent = s.title;
      document.getElementById('cWhat').textContent = s.what;
      document.getElementById('cBlurb').textContent = s.blurb;
            
      if (allMeshes.length > 0) {
        if (idx === 7) {
          allMeshes.forEach(m => m.visible = true);
        } else {
          const chunkCount = Math.ceil(allMeshes.length / 7);
          const visibleLimit = (idx + 1) * chunkCount;
          allMeshes.forEach((m, i) => {
            m.visible = (i < visibleLimit);
          });
        }
      }

      document.getElementById('btnBack').disabled = (idx === 0);
      document.getElementById('btnNext').textContent = (idx === 7) ? 'Finish 🏆' : 'Next →';
    }

    document.getElementById('btnNext').onclick = () => { 
       if(stepIndex < 7) showStep(++stepIndex);
       else location.reload(); 
    };

    document.getElementById('btnBack').onclick = () => { 
       if(stepIndex > 0) showStep(--stepIndex);
    };

    document.getElementById('btnFlip').onclick = () => { 
       flipped = !flipped;
       gsap.to(ROOT.rotation, {x: flipped ? Math.PI : 0, duration: 1, ease: "back.out(1.2)"});
    };

    document.getElementById('chkSpin').onchange = (e) => controls.autoRotate = e.target.checked;

    document.getElementById('btnReframe').onclick = () => { 
       gsap.to(ROOT.rotation, {x: 0, y: 0, z: 0, duration: 0.5});
      const box = new THREE.Box3().setFromObject(ROOT);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      controls.target.set(0, 0, 0); 
      gsap.to(camera.position, {
        x: 0, 
        y: maxDim * 1.0, 
        z: maxDim * 2.5, 
        duration: 0.8,
        onUpdate: () => controls.update()
      });
    };

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    load();

    function animate() { 
       requestAnimationFrame(animate);
       controls.update();
       renderer.render(scene, camera);
    }    
    animate();
  </script>
</body>
</html>
